<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="My-Class-Track — دستیار پیگیری حضور، شهریه و تکالیف کلاس گروه‌درمانی هفتگی" />
  <meta name="theme-color" content="#5b5bd6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>My-Class-Track</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="mask-icon" href="icons/icon.svg" color="#5b5bd6" />

  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">رفتن به محتوای اصلی</a>

  <div class="app-shell">
    <header class="app-header" role="banner">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="تغییر تم روشن و تیره" aria-pressed="false" title="تغییر تم">
        <span class="icon-slot" data-icon="theme" aria-hidden="true">◐</span>
      </button>
      <div class="app-title">
        <span class="app-title__mark" aria-hidden="true">MCT</span>
        <h1 class="app-title__text">My-Class-Track</h1>
      </div>
      <button class="icon-btn" id="quick-help" type="button" aria-label="راهنمای سریع" title="راهنما">
        <span class="icon-slot" data-icon="help" aria-hidden="true">؟</span>
      </button>
    </header>

    <main id="main-content" class="app-main" role="main" tabindex="-1"></main>

    <!-- Visually hidden live region: app.js writes one short sentence here per
         navigation, so screen readers announce the page change without the
         whole re-rendered page being read out. -->
    <p id="route-status" role="status" aria-live="polite" class="sr-only"></p>

    <nav class="bottom-nav" aria-label="ناوبری اصلی">
      <ul class="bottom-nav__list" id="bottom-nav"></ul>
    </nav>
  </div>

  <!-- Container for dialogs & toasts (built by ui.js) -->
  <div id="overlay-root"></div>

  <noscript>
    <p class="noscript-warning">برای استفاده از این برنامه، جاوااسکریپت مرورگر باید فعال باشد.</p>
  </noscript>

  <script type="module" src="src/app.js"></script>
</body>
</html>
